spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
      missing-topics-fatal: false

campuslab:
  kafka:
    topics:
      bookings-stream: "campuslab.bookings.stream"
      telemetry-metrics: "campuslab.telemetry.metrics"
      bookings-dlt: "campuslab.bookings.stream.DLT"
    consumer-groups:
      analytics: "campuslab-analytics-group"
      telemetry: "campuslab-telemetry-group"
      dlt-audit: "campuslab-dlt-audit-group"
