server:
  port: ${PORT:8080}

spring:
  application:
    name: campuslab-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campuslab}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:campuslab}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:campuslab123}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # =====================================================================
  # CONFIGURACIÓN RABBITMQ (Mensajería Transaccional & Notificaciones)
  # =====================================================================
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:${RABBITMQ_HOST:localhost}}
    port: ${SPRING_RABBITMQ_PORT:${RABBITMQ_PORT:5672}}
    username: ${SPRING_RABBITMQ_USERNAME:${RABBITMQ_USER:admin}}
    password: ${SPRING_RABBITMQ_PASSWORD:${RABBITMQ_PASS:admin}}
    listener:
      simple:
        acknowledge-mode: manual

  # =====================================================================
  # CONFIGURACIÓN APACHE KAFKA (Streaming de Eventos & Analítica Continua)
  # =====================================================================
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: campuslab-default-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.campuslab.backend.dto.*,com.campuslab.backend.dto.kafka.*"
        spring.json.use.type.headers: true
    listener:
      missing-topics-fatal: false

  # =====================================================================
  # SEGURIDAD OAUTH2 / IDaaS (Microsoft Entra ID)
  # =====================================================================
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:https://login.microsoftonline.com/4b9ee4c5-a799-40af-88fe-81d4ef8aaba3/v2.0}

campuslab:
  # RabbitMQ Topología
  rabbitmq:
    exchanges:
      direct: "campuslab.direct"
      topic: "campuslab.topic"
    queues:
      notifications: "campuslab.booking.notifications"
      reports: "campuslab.reports.generation"
      audit: "campuslab.audit.events"
      dlq:
        notifications: "campuslab.booking.notifications.dlq"
        reports: "campuslab.reports.generation.dlq"
        audit: "campuslab.audit.events.dlq"
    routing-keys:
      notifications: "routing.notifications"
      reports: "routing.reports.#"
      audit: "routing.audit.#"

  # Kafka Streaming & Analítica Topología
  kafka:
    topics:
      bookings-stream: "campuslab.bookings.stream"
      telemetry-metrics: "campuslab.telemetry.metrics"
      bookings-dlt: "campuslab.bookings.stream.DLT"
    consumer-groups:
      analytics: "campuslab-analytics-group"
      telemetry: "campuslab-telemetry-group"
      dlt-audit: "campuslab-dlt-audit-group"
