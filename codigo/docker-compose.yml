services:
  # =====================================================================
  # 1. CLÚSTER RABBITMQ (Mensajería Transaccional & Notificaciones EP3/EP4)
  # =====================================================================
  rabbitmq1:
    image: rabbitmq:3-management
    hostname: rabbitmq1
    container_name: rabbitmq1
    environment:
      RABBITMQ_ERLANG_COOKIE: "supersecretcookie"
      RABBITMQ_DEFAULT_USER: "admin"
      RABBITMQ_DEFAULT_PASS: "admin"
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - cluster_net

  rabbitmq2:
    image: rabbitmq:3-management
    hostname: rabbitmq2
    container_name: rabbitmq2
    environment:
      RABBITMQ_ERLANG_COOKIE: "supersecretcookie"
    ports:
      - "5673:5672"
      - "15673:15672"
    depends_on:
      - rabbitmq1
    command: >
      bash -c "rabbitmq-server -detached && 
               sleep 10 && 
               rabbitmqctl stop_app && 
               rabbitmqctl join_cluster rabbit@rabbitmq1 && 
               rabbitmqctl start_app && 
               tail -f /dev/null"
    networks:
      - cluster_net

  # =====================================================================
  # 2. APACHE KAFKA & ZOOKEEPER (Streaming & Analítica Continua EP5/EP6)
  # =====================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: campuslab-zookeeper
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - cluster_net

  kafka1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: campuslab-kafka1
    hostname: kafka1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      - cluster_net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: campuslab-kafka-ui
    depends_on:
      - kafka1
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "campuslab-cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka1:9092"
      KAFKA_CLUSTERS_0_ZOOKEEPER: "zookeeper:2181"
    networks:
      - cluster_net

  # =====================================================================
  # 3. BASE DE DATOS POSTGRESQL (Persistencia Relacional)
  # =====================================================================
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "adminpassword"
      POSTGRES_DB: "appdb"
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cluster_net

  # =====================================================================
  # 4. BACKEND SPRING BOOT (Java 21 / Microservicio Unificado Cloud Native)
  # =====================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campuslab_backend
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/appdb"
      SPRING_DATASOURCE_USERNAME: "admin"
      SPRING_DATASOURCE_PASSWORD: "adminpassword"
      SPRING_RABBITMQ_HOST: "rabbitmq1"
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: "admin"
      SPRING_RABBITMQ_PASSWORD: "admin"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka1:9092"
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - rabbitmq1
      - kafka1
    networks:
      - cluster_net

  # =====================================================================
  # 5. FRONTEND ANGULAR (SPA Modular con MSAL / IDaaS y Paneles Duales)
  # =====================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campuslab_frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - cluster_net

networks:
  cluster_net:
    driver: bridge

volumes:
  pgdata:
